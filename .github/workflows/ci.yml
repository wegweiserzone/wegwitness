name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "::error::go.mod/go.sum not tidy; run 'make tidy'" && exit 1)

      - name: Test with race detector
        run: go test -race -shuffle=on ./...

  # The witness against the weg on Wegweiser's main branch. A protocol change
  # lands there first, so this is what catches the copy here falling behind.
  interop:
    name: Interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: wegweiserzone/wegweiser
          path: wegweiser
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build weg
        run: make -C wegweiser build

      - name: Run the witness against it
        run: make interop WEG_BIN="$PWD/wegweiser/bin/weg"

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: make build

      # Otherwise the image is built for the first time by the release that
      # pushes it, and a tag is a bad place to find out the Containerfile no
      # longer works. It is run once, so that a binary that does not start in
      # scratch is caught here too.
      - name: The container image builds and starts
        if: matrix.goarch == 'amd64'
        run: |
          docker buildx build --file packaging/Containerfile --platform linux/amd64 \
            --build-arg "VERSION=ci" --build-arg "COMMIT=$GITHUB_SHA" \
            --load --tag wegwitness:ci .
          docker run --rm wegwitness:ci version
          docker inspect --format '{{json .Config.Healthcheck}}' wegwitness:ci | grep -q 'wegwitness.*health'

  # The deb package and its unit under a systemd that is running, rather than
  # read by systemd-analyze: the runner has one, and root, and nothing
  # installed that the test would clobber. Two versions, so that an upgrade is
  # an upgrade. The tests are scripts so that they run the same on a
  # developer's machine.
  packages:
    name: Packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build two versions
        run: make package VERSION=0.0.1 && make package VERSION=0.0.2

      - name: The deb under systemd
        run: |
          sudo sh scripts/systemd-test.sh \
            dist/wegwitness_0.0.1_amd64.deb dist/wegwitness_0.0.2_amd64.deb

      # Rocky stands for RHEL and its rebuilds, Fedora for the newest rpm.
      - name: The rpm on Rocky Linux 9 and Fedora
        run: |
          for image in docker.io/rockylinux/rockylinux:9 docker.io/library/fedora:latest; do
            echo "::group::$image"
            docker run --rm -v "$PWD:/src:ro" -w /src "$image" sh scripts/rpm-test.sh \
              dist/wegwitness-0.0.1-1.x86_64.rpm dist/wegwitness-0.0.2-1.x86_64.rpm
            echo "::endgroup::"
          done

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...
