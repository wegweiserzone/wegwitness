version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    exhaustive:
      # A switch with a default is exhaustive enough; requiring every case
      # spelled out would fight the "unknown enum value" guard clauses.
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam # measured decisions belong in benchmarks, not in a linter
        - whyNoLint

    govet:
      enable-all: true
      disable:
        - fieldalignment # readability wins until a profile says otherwise

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported # every exported symbol carries a doc comment
          arguments:
            - checkPrivateReceivers
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may take shortcuts that production code may not.
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - unparam
          # A test that reads a response body and hands it back closes it
          # through t.Cleanup, which this linter cannot follow.
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wegweiserzone/wegwitness

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
